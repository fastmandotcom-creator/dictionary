include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

// Local native TTS plugin (ported from duosub-study's Android TextToSpeech + Google web fallback).
include ':dictlearn-tts'
project(':dictlearn-tts').projectDir = new File('./dictlearn-tts/')

// Local native safe-update plugin (ported from duosub-study's update/AppUpdater.kt:
// GitHub host allowlist, SHA-256, 150 MB cap, PackageInstaller self-update).
include ':dictlearn-update'
project(':dictlearn-update').projectDir = new File('./dictlearn-update/')

apply from: 'capacitor.settings.gradle'