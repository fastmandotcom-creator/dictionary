<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn tập — Dict Learn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="min-h-full flex flex-col bg-slate-950 text-slate-100">
  <script src="/srs.js"></script>
  <script>
    var BASE = '{{ base }}';
    var TARGET = '{{ target }}';
    const CARD_IDS = {{ card_ids | tojson }};
    let index = 0, flipped = false;
    const state = { pool: [] };
    let curTarget = '';

    function loadCards() {
      const list = document.getElementById('cards');
      if (!CARD_IDS.length) { list.innerHTML = '<div class="text-slate-500 text-sm p-6">Chưa có từ nào cho mức này.</div>'; return; }
      const due = CARD_IDS.filter(function (id) { return Srs.isDue(id, BASE, TARGET); });
      const srsMap = Srs.readSrs(BASE, TARGET);
      // Most-overdue first: group by due date (oldest group first), shuffle
      // only WITHIN each group so ordering across days is deterministic.
      var groups = {};
      due.forEach(function (id) {
        var key = (srsMap[id] && srsMap[id].due) || 'new';
        (groups[key] = groups[key] || []).push(id);
      });
      var ordered = Object.keys(groups).sort().map(function (k) { return Srs.shuffle(groups[k]); })
        .reduce(function (a, b) { return a.concat(b); }, []);
      state.pool = ordered.length ? ordered.slice(0, 30) : [];
      // estimate banner: ~20s per card
      var banner = document.getElementById('session-est');
      if (banner) {
        if (state.pool.length) {
          var mins = Math.max(1, Math.round((state.pool.length * 20) / 60));
          banner.textContent = 'Buổi ôn hôm nay: ' + state.pool.length + ' thẻ · khoảng ' + mins + ' phút';
        } else {
          banner.textContent = 'Hôm nay không có thẻ nào đến hạn.';
        }
      }
      index = 0; flipped = false;
      if (!state.pool.length) {
        list.innerHTML = '<div class="text-center p-8 text-sm text-slate-400">Không có thẻ nào đến hạn hôm nay.<br>Thẻ "good" quay lại sau 7 ngày. 🎉</div>';
        return;
      }
      document.getElementById('count').textContent = 'Còn ' + state.pool.length + ' thẻ';
      render();
    }
    function render() {
      const list = document.getElementById('cards');
      const id = state.pool[index];
      curTarget = '';
      list.innerHTML =
        '<div class="text-xs text-slate-500 font-mono">' + id + '</div>' +
        '<div class="text-2xl font-bold text-white my-3" id="card-target">…</div>' +
        '<button class="text-xs text-slate-400 mt-2 hover:text-emerald-400" id="speak-btn">&#128266; Nghe</button>' +
        '<p id="speak-note" class="hidden text-xs text-amber-400/90 mt-1"></p>' +
        '<div class="text-sm text-emerald-300 mt-2 hidden" id="card-base"></div>' +
        '<button class="text-xs text-slate-400 mt-4" id="flip-btn">Hiện đáp án</button>';
      document.getElementById('speak-btn').onclick = function () { speakTarget(true); };
      document.getElementById('flip-btn').onclick = flip;
      fetch('/api/learn/' + encodeURIComponent(id) + '?base=' + BASE + '&target=' + TARGET)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          curTarget = (d.target && d.target.text) || (d.concept && d.concept.gloss_en) || '';
          document.getElementById('card-target').textContent = curTarget;
          document.getElementById('card-base').textContent = (d.base && d.base.text) || '';
        });
    }
    function flip() { document.getElementById('card-base').classList.remove('hidden'); }
    function speakTarget(withNote) {
      if (!curTarget) return;
      Srs.speak(curTarget, TARGET, withNote ? function (msg) {
        var note = document.getElementById('speak-note');
        if (note) { note.textContent = msg; note.classList.remove('hidden'); }
      } : null);
    }
    function grade(gradeVal) {
      Srs.grade(state.pool[index], gradeVal, BASE, TARGET);
      const remaining = state.pool.length - index - 1;
      if (remaining > 0) { index++; flipped = false; document.getElementById('count').textContent = 'Còn ' + remaining + ' thẻ'; render(); }
      else {
        document.getElementById('cards').innerHTML =
          '<div class="text-emerald-400 font-semibold text-lg p-4">Xong ' + state.pool.length + ' thẻ.</div>' +
          '<div class="text-xs text-slate-400 p-2">Chưa = 1 ngày · Tạm = 3 ngày · Nhớ = 7 ngày.</div>';
      }
    }
    window.addEventListener('DOMContentLoaded', loadCards);
  </script>
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-30">
    <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <span class="text-sm font-semibold text-white">
        Ôn tập flashcard
        {% if exam %}<span class="text-slate-400 font-normal">· {{ exam }}</span>{% elif cefr %}<span class="text-slate-400 font-normal">· {{ cefr }}</span>{% else %}<span class="text-slate-400 font-normal">· Tất cả mức</span>{% endif %}
      </span>
      <div class="flex items-center gap-2 text-xs">
        <span id="count" class="text-slate-400"></span>
        {% if exam %}
        <a href="/learn?base={{ base }}&target={{ target }}&exam={{ exam }}" class="hover:text-white text-slate-400">←</a>
        {% elif cefr %}
        <a href="/learn?base={{ base }}&target={{ target }}&cefr={{ cefr }}" class="hover:text-white text-slate-400">←</a>
        {% else %}
        <a href="/learn?base={{ base }}&target={{ target }}" class="hover:text-white text-slate-400">←</a>
        {% endif %}
      </div>
    </div>
  </header>
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-6">
    <p id="session-est" class="text-xs text-slate-500 mb-3"></p>
    <div id="cards" class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center min-h-[220px] flex flex-col items-center justify-center"></div>
    <div class="flex justify-center gap-2 mt-4">
      <button onclick="grade('hard')" class="bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-lg px-4 py-2 text-sm font-semibold hover:bg-rose-500/20">Chưa (1 ngày)</button>
      <button onclick="grade('ok')" class="bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-lg px-4 py-2 text-sm font-semibold hover:bg-amber-500/20">Tạm (3 ngày)</button>
      <button onclick="grade('good')" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg px-4 py-2 text-sm font-semibold hover:bg-emerald-500/20">Nhớ (7 ngày)</button>
    </div>
  </main>
</body>
</html>
