<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn tập — Dict Learn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="min-h-full flex flex-col bg-slate-950 text-slate-100">
  <script>
    const KEY = 'dict_learn_progress_{{ base }}_{{ target }}';
    const CARD_IDS = {{ card_ids | tojson }};
    let index = 0;
    let flipped = false;
    function loadCards() {
      const list = document.getElementById('cards');
      if (!CARD_IDS.length) { list.innerHTML = '<div class="text-slate-500 text-sm p-6">Chưa có từ nào cho mức này.</div>'; return; }
      let map = {};
      try { map = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
      const due = CARD_IDS.filter(function (id) { return map[id] !== 'good'; });
      const pool = due.length ? due : CARD_IDS;
      state.pool = pool.slice(0, 30);
      index = 0; flipped = false;
      render();
      document.getElementById('count').textContent = 'Còn ' + state.pool.length + ' thẻ';
    }
    const state = { pool: [] };
    function render() {
      const card = document.getElementById('card');
      const id = state.pool[index];
      card.dataset.id = id;
      card.innerHTML = '<div class="text-xs text-slate-500 font-mono">' + id + '</div>' +
        '<div class="text-2xl font-bold text-white my-3" id="card-target">…</div>' +
        '<div class="text-sm text-emerald-300 mt-2 hidden" id="card-base"></div>' +
        '<button class="text-xs text-slate-400 mt-4" onclick="flip()">Hiện đáp án</button>';
      fetch('/api/learn/' + encodeURIComponent(id) + '?base={{ base }}&target={{ target }}')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          document.getElementById('card-target').textContent = (d.target && d.target.text) || d.concept.gloss_en;
          document.getElementById('card-base').textContent = (d.base && d.base.text) || '';
        });
    }
    function flip() { flipped = true; document.getElementById('card-base').classList.remove('hidden'); }
    function grade(gradeVal) {
      let map = {};
      try { map = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
      map[state.pool[index]] = gradeVal;
      localStorage.setItem(KEY, JSON.stringify(map));
      if (index + 1 < state.pool.length) { index++; flipped = false; render(); }
      else { document.getElementById('card').innerHTML = '<div class="text-emerald-400 font-semibold text-lg p-4">Xong ' + state.pool.length + ' thẻ. 🎉</div>'; }
    }
    window.addEventListener('DOMContentLoaded', loadCards);
  </script>
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-30">
    <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <span class="text-sm font-semibold text-white">Ôn tập flashcard</span>
      <div class="flex items-center gap-2 text-xs">
        <span id="count" class="text-slate-400"></span>
        <a href="/learn?base={{ base }}&target={{ target }}&cefr={{ cefr }}" class="hover:text-white text-slate-400">←</a>
      </div>
    </div>
  </header>
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-6">
    <div id="card" class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center min-h-[220px] flex flex-col items-center justify-center"></div>
    <div class="flex justify-center gap-2 mt-4">
      <button onclick="grade('hard')" class="bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-lg px-4 py-2 text-sm font-semibold hover:bg-rose-500/20">Chưa</button>
      <button onclick="grade('ok')" class="bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-lg px-4 py-2 text-sm font-semibold hover:bg-amber-500/20">Tạm</button>
      <button onclick="grade('good')" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg px-4 py-2 text-sm font-semibold hover:bg-emerald-500/20">Nhớ</button>
    </div>
  </main>
</body>
</html>
