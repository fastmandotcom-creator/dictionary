<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện nghe–viết — {{ target_name }} ← {{ base_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="min-h-full flex flex-col bg-slate-950 text-slate-100">
  <script src="/srs.js"></script>
  <script src="/drills.js"></script>
  <script src="/asr.js"></script>
  <script>
    var BASE = '{{ base }}';
    var TARGET = '{{ target }}';
    var TOPIC0 = {{ topic | tojson }};
    var CEFR0 = {{ cefr | tojson }};
    const TOPICS = {{ topics | tojson }};
    const CONCEPTS = {{ concepts | tojson }};
    const HAS_NEXT_PAGE = {{ has_next_page | tojson }};
    const NEXT_OFFSET = {{ next_offset | tojson }};
    const NEXT_CONCEPT_ID = {{ next_concept_id | tojson }};
    const CURRENT_OFFSET = {{ offset | tojson }};
    const TOTAL_COUNT = {{ total_count | tojson }};
    const EXAM = {{ exam | tojson }};
    var topic = TOPIC0;
    var cefrVal = CEFR0;
    var currentConceptIdx = 0;
    var autoNextTimer = null;

    function renderConceptList() {
      var list = document.getElementById('concept-list');
      if (!CONCEPTS.length) {
        list.innerHTML = '<div class="text-xs text-slate-500 p-3">Chưa có từ ở mức này.</div>';
        return;
      }
      list.innerHTML = CONCEPTS.map(function (c, idx) {
        return '<button data-cid="' + c.id + '" data-idx="' + idx + '" class="concept-btn block w-full text-left px-3 py-2.5 rounded-lg ' +
          'hover:bg-slate-800/70 transition border border-transparent">' +
          '<div class="flex items-center justify-between gap-1 text-sm font-semibold text-slate-200">' +
          '<span class="truncate">' + (c.en || c.id) + '</span>' +
          '<span class="text-[10px] font-mono text-slate-500 font-normal px-1 py-0.5 rounded bg-slate-800/80 shrink-0">' + c.id + '</span></div>' +
          '<div class="text-xs text-slate-400 truncate mt-0.5">' + c.gloss + ' <span class="text-slate-600">· ' + c.cefr + '</span></div></button>';
      }).join('');
      list.querySelectorAll('.concept-btn').forEach(function (b) {
        b.onclick = function () {
          var idx = Number(b.dataset.idx);
          var c = CONCEPTS[idx];
          openDrills(c, idx);
        };
      });
    }

    function openDrills(c, idx) {
      if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
      if (typeof idx === 'number') {
        currentConceptIdx = idx;
      } else {
        currentConceptIdx = CONCEPTS.findIndex(function (x) { return x.id === c.id; });
        if (currentConceptIdx < 0) currentConceptIdx = 0;
      }

      // Highlight active concept button and scroll into view smoothly
      var list = document.getElementById('concept-list');
      if (list) {
        var btns = list.querySelectorAll('.concept-btn');
        btns.forEach(function (b, i) {
          if (i === currentConceptIdx) {
            b.classList.add('bg-slate-800', 'border-emerald-500/40');
            b.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          } else {
            b.classList.remove('bg-slate-800', 'border-emerald-500/40');
          }
        });
      }

      var el = document.getElementById('drill-card');
      el.innerHTML = '<div class="text-center p-8 text-sm text-slate-500">Đang chuẩn bị: ' + c.id + '…</div>';
      document.getElementById('drill-meta').textContent = c.id + ' · chủ đề: ' + topic;

      var autoPlayChecked = document.getElementById('autoplay-toggle') ? document.getElementById('autoplay-toggle').checked : true;

      var upcoming = CONCEPTS[currentConceptIdx + 1];
      if (upcoming) DrillUI.prefetch(upcoming, TARGET, topic);
      else if (NEXT_CONCEPT_ID) DrillUI.prefetch({ id: NEXT_CONCEPT_ID }, TARGET, topic);

      DrillUI.player(el, {
        base: BASE, target: TARGET, topic: topic, concept: c,
        autoplay: autoPlayChecked,
        onAllDone: function (done, total) {
          var hasNext = currentConceptIdx + 1 < CONCEPTS.length;
          if (hasNext) {
            var nextIdx = currentConceptIdx + 1;
            var nextC = CONCEPTS[nextIdx];
            var cd = 2;
            el.innerHTML =
              '<div class="text-center p-6 w-full">' +
              '<div class="text-2xl font-bold text-emerald-400 mb-2">🎉 Hoàn thành: ' + (c.en || c.id) + '!</div>' +
              '<p class="text-xs text-slate-400 mb-4">Đã luyện xong các thì &amp; dạng câu (' + (total || 9) + ' câu).</p>' +
              '<div class="bg-slate-950 border border-slate-800 rounded-xl p-4 max-w-sm mx-auto mb-5 text-left">' +
              '  <div class="text-[11px] uppercase tracking-wider text-slate-500 font-semibold mb-1">Từ tiếp theo trong lộ trình:</div>' +
              '  <div class="text-base font-bold text-white">' + (nextC.en || nextC.id) + ' <span class="text-xs text-slate-400 font-normal">(' + nextC.gloss + ')</span></div>' +
              '  <div id="countdown-label" class="text-xs text-emerald-400 mt-2">Tự động chuyển sau <span id="cd-sec">' + cd + '</span>s...</div>' +
              '</div>' +
              '<div class="flex justify-center gap-3">' +
              '  <button id="go-next-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded-lg text-sm transition">Tiếp tục từ này &rarr; (Enter)</button>' +
              '  <a href="/learn?base=' + BASE + '&target=' + TARGET + '" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-lg text-sm transition">Nghỉ / Lộ trình</a>' +
              '</div>' +
              '</div>';

            var doNext = function () {
              if (autoNextTimer) { clearInterval(autoNextTimer); autoNextTimer = null; }
              document.removeEventListener('keydown', onCelebrateKey);
              openDrills(nextC, nextIdx);
            };

            var onCelebrateKey = function (e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                doNext();
              }
            };
            document.addEventListener('keydown', onCelebrateKey);

            var nextBtn = document.getElementById('go-next-btn');
            if (nextBtn) nextBtn.onclick = doNext;

            autoNextTimer = setInterval(function () {
              cd--;
              var secEl = document.getElementById('cd-sec');
              if (secEl) secEl.textContent = cd;
              if (cd <= 0) {
                doNext();
              }
            }, 1000);
          } else if (HAS_NEXT_PAGE) {
            var nextBatchUrl = '/listen?base=' + BASE + '&target=' + TARGET + '&topic=' + topic +
              (cefrVal ? '&cefr=' + cefrVal : '') + (EXAM ? '&exam=' + EXAM : '') + '&offset=' + NEXT_OFFSET;
            var cdBatch = 3;
            el.innerHTML =
              '<div class="text-center p-6 w-full">' +
              '<div class="text-2xl font-bold text-emerald-400 mb-2">🎉 Hoàn thành đợt này!</div>' +
              '<p class="text-sm text-slate-300 mb-4">Đã luyện xong ' + CONCEPTS.length + ' từ (từ ' + (CURRENT_OFFSET + 1) + ' đến ' + (CURRENT_OFFSET + CONCEPTS.length) + ' trên tổng ' + TOTAL_COUNT + ' từ).</p>' +
              '<div class="bg-slate-950 border border-slate-800 rounded-xl p-4 max-w-sm mx-auto mb-5 text-left">' +
              '  <div class="text-[11px] uppercase tracking-wider text-slate-500 font-semibold mb-1">Đợt tiếp theo:</div>' +
              '  <div class="text-base font-bold text-white">Từ ' + (NEXT_OFFSET + 1) + ' đến ' + Math.min(NEXT_OFFSET + 60, TOTAL_COUNT) + '</div>' +
              '  <div id="batch-cd" class="text-xs text-emerald-400 mt-2">Tự động nạp sau <span id="batch-sec">' + cdBatch + '</span>s...</div>' +
              '</div>' +
              '<div class="flex justify-center gap-3">' +
              '  <a id="load-next-batch-btn" href="' + nextBatchUrl + '" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded-lg text-sm transition">Nạp tiếp 60 từ &rarr; (Enter)</a>' +
              '  <a href="/learn?base=' + BASE + '&target=' + TARGET + '" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-lg text-sm transition">Về lộ trình</a>' +
              '</div>' +
              '</div>';

            var goNextBatch = function () {
              location.href = nextBatchUrl;
            };

            var onBatchKey = function (e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                document.removeEventListener('keydown', onBatchKey);
                goNextBatch();
              }
            };
            document.addEventListener('keydown', onBatchKey);

            var batchTimer = setInterval(function () {
              cdBatch--;
              var secEl = document.getElementById('batch-sec');
              if (secEl) secEl.textContent = cdBatch;
              if (cdBatch <= 0) {
                clearInterval(batchTimer);
                document.removeEventListener('keydown', onBatchKey);
                goNextBatch();
              }
            }, 1000);
          } else {
            el.innerHTML =
              '<div class="text-center p-6 w-full">' +
              '<div class="text-2xl font-bold text-emerald-400 mb-2">🎉 Đỉnh cao!</div>' +
              '<p class="text-sm text-slate-300 mb-4">Bạn đã hoàn thành toàn bộ ' + TOTAL_COUNT + ' từ vựng trong kho dữ liệu.</p>' +
              '<a href="/learn?base=' + BASE + '&target=' + TARGET + '" class="inline-block bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-lg text-sm transition">← Về lộ trình</a>' +
              '</div>';
          }
        }
      });
    }

    window.addEventListener('DOMContentLoaded', function () {
      var sel = document.getElementById('topic-select');
      sel.value = topic;
      sel.onchange = function () {
        location.href = '/listen?base=' + BASE + '&target=' + TARGET + '&topic=' + this.value +
          (cefrVal ? '&cefr=' + cefrVal : '') + (EXAM ? '&exam=' + EXAM : '') + '&offset=0';
      };
      var cefrSel = document.getElementById('cefr-select');
      if (cefrSel) {
        cefrSel.onchange = function () {
          location.href = '/listen?base=' + BASE + '&target=' + TARGET + '&topic=' + topic +
            (this.value ? '&cefr=' + this.value : '') + (EXAM ? '&exam=' + EXAM : '') + '&offset=0';
        };
      }
      renderConceptList();
      if (CONCEPTS.length) openDrills(CONCEPTS[0], 0);
      Srs.ensureDevice().then(function () {
        Srs.sync(BASE, TARGET, function (s, n) {
          var badge = document.getElementById('sync-badge');
          if (badge) {
            badge.classList.remove('hidden'); badge.classList.add('flex');
            badge.textContent = s === 'synced' ? '☁ Đã đồng bộ' : '☁ Chờ đồng bộ ' + n;
          }
        });
      }).catch(function () {});
    });
  </script>
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-30">
    <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5 text-sm">
        <span class="text-emerald-400 font-semibold">{{ base_name }}</span>
        <span class="text-slate-500">→</span>
        <span class="text-sky-400 font-semibold">{{ target_name }}</span>
        <span class="text-xs text-slate-500 hidden sm:inline">· Luyện nghe–viết</span>
      </div>
      <div class="flex items-center gap-3 text-xs text-slate-400">
        <span id="sync-badge" class="hidden items-center gap-1 text-slate-500"></span>
        <a href="/learn?base={{ base }}&target={{ target }}" class="hover:text-white">← Lộ trình</a>
      </div>
    </div>
  </header>
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6">
    <div class="flex items-center gap-3 mb-4 text-xs flex-wrap">
      <span class="text-slate-500">Chủ đề:</span>
      <select id="topic-select" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-emerald-500">
        {% for t in topics %}
        <option value="{{ t }}" {% if t == topic %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
      <span class="text-slate-500 ml-1">Mức:</span>
      <select id="cefr-select" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-emerald-500">
        <option value="" {% if not cefr %}selected{% endif %}>Tất cả mức</option>
        {% for lvl in cefr_levels %}
        <option value="{{ lvl }}" {% if cefr == lvl %}selected{% endif %}>{{ lvl }}</option>
        {% endfor %}
      </select>
      <label class="flex items-center gap-1.5 text-slate-400 ml-auto cursor-pointer select-none">
        <input type="checkbox" id="autoplay-toggle" class="accent-emerald-500" checked>
        <span>🔊 Tự động phát âm</span>
      </label>
    </div>
    <div class="flex flex-col md:flex-row gap-4">
      <section class="flex-1 min-w-0 order-1 md:order-2">
        <div id="drill-card" class="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-5 min-h-[260px] flex items-center justify-center">
          <div class="text-center text-sm text-slate-500">Chọn một từ để bắt đầu luyện nghe–viết.</div>
        </div>
        <div id="drill-meta" class="text-xs text-slate-600 mt-2"></div>
        <p class="text-xs text-slate-500 mt-2">Nghe câu → gõ lại đúng chính tả → tự chấm thẻ (Chưa 1 ngày / Tạm 3 ngày / Nhớ 7 ngày).</p>
      </section>
      <aside class="w-full md:w-56 shrink-0 order-2 md:order-1">
        <div class="flex items-center justify-between mb-2">
          <div class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Từ để luyện</div>
          <span class="text-[10px] text-slate-500 font-mono">{{ offset + 1 }}-{{ [offset + limit, total_count] | min }}/{{ total_count }}</span>
        </div>
        <div id="concept-list" class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden max-h-64 md:max-h-[640px] overflow-y-auto"></div>
      </aside>
    </div>
  </main>
</body>
</html>
